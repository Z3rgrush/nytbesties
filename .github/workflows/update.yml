name: Update scoreboard

on:
  schedule:
    # The NYT posts new lists Wednesday evening (ET). Run late Wednesday
    # night and again Thursday morning in case the list was late.
    - cron: "30 3 * * 4"
    - cron: "0 14 * * 4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scoreboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new lists
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
        run: python scripts/fetch_lists.py
      - name: Build scoreboard
        run: python scripts/build.py
      - name: Commit changes
        run: |
          git config user.name "scoreboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet -- data/lists; then
            echo "No new list this run."
            exit 0
          fi
          git commit -m "Update scoreboard through $(ls data/lists | sort | tail -1 | sed 's/.json//')"
          git push
