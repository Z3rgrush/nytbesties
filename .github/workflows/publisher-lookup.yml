name: Publisher lookup

on:
  workflow_dispatch:
    inputs:
      publisher:
        description: "Publisher name as NYT prints it"
        required: true
      start:
        description: "List date to start from (walks backward)"
        required: true
        default: "2024-12-29"
      stop_year:
        description: "Earliest year to scan"
        required: true
        default: "2018"

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look up Hardcover Fiction history
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          PUBLISHER: ${{ inputs.publisher }}
        run: |
          set -o pipefail
          python scripts/scan_publisher.py "$PUBLISHER" "${{ inputs.start }}" "${{ inputs.stop_year }}" | tee -a "$GITHUB_STEP_SUMMARY"
